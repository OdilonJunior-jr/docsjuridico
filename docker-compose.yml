services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      GOTENBERG_URL: http://gotenberg:3000
    depends_on:
      - gotenberg
    restart: unless-stopped
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3001:3000"
    restart: unless-stopped
